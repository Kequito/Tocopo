<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tocopo">
<meta name="format-detection" content="telephone=no">
<title>Tocopo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="safe-probe"></div>
<div id="wrap">
  <div id="game">
    <canvas id="screen" width="512" height="288"></canvas>

    <div id="hud" class="hidden">
      <div class="box hud-main">
        <div class="hud-top"><span id="hud-region"></span><span id="hud-lv"></span></div>
        <div class="hud-bars">
          <div class="hud-bar"><b>VID</b><div class="bar hp"><i id="hud-hpbar"></i></div><span id="hud-hp"></span></div>
          <div class="hud-bar"><b>ENE</b><div class="bar ene"><i id="hud-enebar"></i></div><span id="hud-ene"></span></div>
        </div>
        <div class="hud-bottom"><span id="hud-res"></span><div id="hud-inv"></div></div>
      </div>
      <div class="box hud-side"><div id="hud-muts"></div></div>
      <button id="menu-btn" class="icon-btn" aria-label="Menú">☰</button>
    </div>
    <div id="nodeinfo" class="box hidden"></div>

    <div id="battle-ui" class="hidden">
      <div id="enemy-boxes"></div>
      <div id="battle-panel" class="box">
        <div id="player-box"></div>
        <div id="battle-left">
          <div id="battle-log"></div>
          <div id="battle-actions" class="hidden"></div>
        </div>
      </div>
    </div>

    <div id="title-ui" class="hidden">
      <div class="logo">TOCOPO</div>
      <div class="tagline">Roguelike de mutaciones prehistóricas</div>
      <div id="title-menu"></div>
      <div class="credits">Flechas / WASD · Z / Enter · X / Esc</div>
    </div>

    <div id="banner"></div>
    <div id="dialog" class="hidden"><div class="speaker"></div><div class="text"></div><div class="next">▼</div></div>
    <div id="menu-layer"></div>
    <div id="toast"></div>
    <div id="fade" class="on"></div>
  </div>
</div>

<!-- Datos (balance) -->
<script src="data/config.js"></script>
<script src="data/mutaciones.js"></script>
<script src="data/enemigos.js"></script>
<script src="data/objetos.js"></script>
<script src="data/eventos.js"></script>
<script src="data/regiones.js"></script>
<script src="data/textos.js"></script>
<!-- Lógica -->
<script src="js/ui.js"></script>
<script src="js/rng.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/run.js"></script>
<script src="js/nodemap.js"></script>
<script src="js/battle.js"></script>
<script src="js/nodes.js"></script>
<script src="js/game.js"></script>
</body>
</html>
